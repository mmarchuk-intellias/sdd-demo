  epic: EP-04
  feature: FT-04.2
  implements: [SS-108]
  traces_to: [REQ-048, REQ-052]
  kyiv: K
  description: 'In booking/allocation (sub-folder fault-rebooking/), implement the per-booking decisions the fault-rebooking
    saga calls (SS-036 clause 1, batch 1): affectedByFault(trigger) lists the active bookings allocated to the EVSE in slot-start
    order and the site''s confirmed bookings later that day (site time zone) with no allocation; rebookAllocated(triggerId,
    bookingId, cause, actor) rebooks one allocated booking to a free compatible EVSE at the same site (T-301, faulted EVSE
    excluded) with the cause''s reason code (MOVED_CHARGER_FAULT here; T-314 and T-315 reuse it with an ops actor and with
    MOVED_MAINTENANCE), deactivates the old allocation and emits booking.reallocated (T-306) so the station hold moves (T-321,
    T-317) and the driver is told (SS-301). With no free compatible EVSE it keeps the booking on the faulted EVSE and calls
    the unplaced port (T-309). Each decision is idempotent per trigger and booking, and a booking already moved off the
    EVSE by an earlier trigger is skipped. A rebooked booking gets no NoShow and the fee exclusion ''rebooked'' (T-303).
    The rule is the same for faults from the CSMS or the attendant and at every supply pattern. Consumes the fault-event
    contract of SS-208 clause 2. A-017, A-050 (Q-038). Out of scope: the saga, its restart and the ''fault rebooking incomplete''
    exception (SS-036); unallocated bookings (T-308); outcomes (T-310).

    '
