- id: T-302
  title: Allocate each confirmed booking at its allocation offset
  type: backend
  status: approved
  version: 1
  approved_with: {SS-100: 1, SS-102: 1}
  epic: EP-02
  feature: FT-02.1
  implements: [SS-100, SS-102]
  traces_to: [REQ-003, REQ-007]
  kyiv: K
  description: 'In booking/allocation, implement the allocation step the booking workflow calls at the Allocation offset
    (SS-032 clause 4): runAllocationStep(bookingId, dueAt, firedAt, stepKey). It returns NOT_DUE and writes nothing before
    the slot start minus the Allocation offset of the booking''s parameter version; does nothing for a booking no longer
    active (cancelled or released); picks the EVSE with T-301; writes the allocation (T-300); records the state change Allocated
    through the Booking engine (SS-020 clause 1) with the system as actor and ALLOCATED; and emits one domain event booking.allocated
    (booking id, EVSE id, stall label) for Messaging (SS-301), the Station-hold dispatcher and the attendant view. A step
    repeated with the same stepKey changes nothing (code conventions row 8). If no free compatible EVSE exists, or the constraint
    makes it lose a race (EVSE_TAKEN), it retries the selector once without that EVSE and otherwise leaves the booking unallocated
    and calls the site-full port (implemented by T-305). Add deactivateAllocation(bookingId, cause) to the public interface
    and call it on the Booking engine''s booking-cancelled event (SS-013 clause 5) and booking-rebooked event (SS-011 clause
    3); the end-of-grace step (T-332) and every rebooking path of this batch call it directly. The timer is the workflow''s
    (SS-032, SS-034); this task builds only the step and its guard. It binds this step to the booking workflow''s activity
    port in `backend/src/workflows/booking/activities/` (batch 1''s T-161, SS-032 clause 4), replacing the stub there; nothing
    else in the workflows module changes. Out of scope: site-full behaviour (T-305), reallocation (T-306).

    '
  acceptance_criteria: ['SS-100.1: integration test: confirming a booking creates no allocation and no allocation event,
      and calling the step before slot start minus the booking''s Allocation offset returns NOT_DUE and writes nothing.',
    'SS-100.2: integration test: the step at the Allocation offset for an active confirmed booking creates exactly one active
      allocation on the EVSE the selector chose; a replay with the same step key creates nothing more.', 'SS-100.3: integration
      test: one booking.allocated event with the booking id, EVSE id and stall label is emitted per allocation, and none
      on a replayed step.', 'SS-100.4: integration test: with no free compatible EVSE the step leaves the booking unallocated,
      emits no booking.allocated and calls the site-full port once.', 'SS-100.5: integration test: for a booking cancelled,
      and for one released, before its Allocation offset, the step creates no allocation.', 'SS-100.6: integration test:
      the Allocated state change in the booking''s history carries the system as actor and the reason code ALLOCATED.',
    'SS-100.7: integration test parameterised over the three seeded sites (patterns A, B, C) with different Allocation offsets:
