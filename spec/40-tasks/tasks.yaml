- id: T-957
  title: Keep invoice submissions pending while Stripe is down and retry them durably
  type: integration
  status: approved
  version: 1
  approved_with: {SS-412: 1}
  epic: EP-10
  feature: FT-10.3
  implements: [SS-412]
  traces_to: [REQ-084, REQ-244, REQ-245]
  kyiv: K
  description: 'Submission runs as one Temporal workflow per platform invoice (invoice-submission-<invoiceId>, in backend/src/workflows/settlement):
    the close starts it and returns at once; on PROVIDER_UNAVAILABLE it waits the configured payment retry interval (SS-026
    clause 2, default 15 min) and retries with the same keys while the submission is younger than the configured provider
    idempotency-key retention (held by SS-412 in the Payments integration''s configuration, default 24 h, A-059); past that
    age it first searches Stripe for an invoice with metadata platform_invoice_id and records it if found, submitting again
    only if none is found; if the search cannot be made, the submission stays pending and unsubmitted and is shown to finance
    as blocked. After a restart the workflow resumes with the same keys. Q-062 (2) asks Stripe''s retention and search;
    the default and the clause 7 fallback cover it.

    '
  acceptance_criteria: ['SS-412.3: test with Stripe unreachable runs month close, a booking and a ledger posting; all complete
      at once and the submission is pending.', 'SS-412.4: time-skipping test with Stripe failing three times asserts retries
      at the configured interval and acceptance on the fourth attempt, all within the retention.', 'SS-412.6: parameterised
      test past the retention: the search finds the invoice (recorded, no submission) and finds none (one new submission).',
    'SS-412.7: test past the retention with the search failing asserts no submission and the invoice shown to finance as
      blocked.', 'SS-412.9: test stops the worker with submissions pending and restarts it; each resumes with its original
      idempotency key.']
  needs: [SS-026.2]
  depends_on: [T-102, T-1007]
  blocks: [T-972]
  estimate: null
