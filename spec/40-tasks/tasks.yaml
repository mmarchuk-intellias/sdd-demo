  description: 'In booking/allocation (fault-rebooking/), implement the unplaced handler T-307, T-308 and T-315 call with
    the trigger''s cause and time. It asks the Booking engine for the next free compatible slot at the site (SS-009 clause
    3) and the nearest at other sites (SS-010 clause 1), each offer carrying the cause''s code (MOVED_CHARGER_FAULT or MOVED_MAINTENANCE),
    and emits booking.offers_produced for Messaging (SS-316) within the platform-wide Fault offer time (default 3 min) of
