- id: T-1011
  title: Anonymise and purge the driver data in the migration module's run records
  type: backend
  status: approved
  version: 1
  approved_with: {SS-337: 1, SS-336: 1}
  epic: EP-13
  feature: FT-13.4
  implements: [SS-337, SS-336]
  traces_to: [REQ-125, REQ-233]
  kyiv: K
  description: 'In the migration module (`backend/src/modules/migration`), the anonymisation and purge handlers for the
    driver personal data that runs keep: the source values of each conflict-list entry for the driver field, numbers and
    names included (T-980), and the evidence of re-classification rules, which can quote an Airtable comment (T-982). Migrated
    bookings and driver records are the booking and fleet modules'' and are handled there (T-355, T-208); the raw export
    itself is deleted at the end of its retention (T-986). Anonymisation replaces the driver''s number, name and quoted
    comment with the pseudonym in every run''s records; the purge uses the raw export''s retention period, a client decision
    shown ''not set'' until counsel sets it (A-025, Q-022). It implements the handler contract of the audit module (batch
    4''s T-789: list the records whose retention period has ended and delete or pseudonymise them when the retention run
    asks; replace one driver''s personal data with the pseudonym the anonymisation passes, T-791). Both handlers are idempotent,
    so the post-restore step can re-apply them (T-790), and never delete a booking, an audit entry or a ledger entry (SS-336
    clause 3). They are registered with the contract, and each field they handle has its data-register entry with class
    and retention ''not set'' until counsel sets it (SC4, A-025, Q-022), so T-789''s CI check finds a handler for every
    entry with a period. Logs carry ids only (SC5). Added at Gate 4 (P4.2 critique NEW-Q-P2-1).

    '
  acceptance_criteria: ['SS-337.1 (migration part): integration test: after the migration module''s anonymisation handler
      runs for a driver, no conflict-list entry and no rule evidence of any run holds the driver''s number, name or quoted
      comment, the pseudonym stands in their place, and every other field (booking, rule id and version, outcome) is unchanged.',
    'SS-336.2 (migration part): integration test: with a test retention period set for the run records, the purge handler,
      asked by the run, deletes the driver values and quoted comments of runs whose period has ended and keeps the runs''
      counts and outcomes.']
  needs: [SS-336.3]
  depends_on: [T-789, T-980, T-982]
