- id: T-105
  title: Make capacity-rule changes idempotent with one change and one history entry per key
  type: backend
  status: approved
  version: 1
  approved_with: {SS-025: 1}
  epic: EP-14
  feature: FT-14.3
  implements: [SS-025]
  traces_to: [REQ-236]
  kyiv: K
  description: 'Apply the idempotency library of T-207 to the capacity-rule and bookable-hours endpoints of T-104 with the
    rules of SS-025: a key is required from the station portal and the ops console; the key is looked up before validation,
    so a repeat of a saved rule is answered as saved and not as overlapping the rule its first save created; a repeat returns
    the stored result (the saved rule or the original refusal) and writes no new change or change-history entry; the same
    key with a different request is 409 IDEMPOTENCY_KEY_REUSED. Keys are kept at least 7 days with a request hash (A-035).
    The change history is the configuration audit of SS-333, fed by the configuration-changed event of T-104. Out of scope:
    the portal and console forms that keep one key per form (SS-236, SS-237).

    '
  acceptance_criteria: ['SS-025.1: a capacity-rule change without an Idempotency-Key, from a station-operator or an ops
      principal, is refused with IDEMPOTENCY_KEY_REQUIRED and the rules are unchanged.', 'SS-025.2: repeating a change with
      the same key and body returns the first response (the saved rule, or for a first refusal the same refusal), and the
      change history holds one entry for it.', 'SS-025.3: repeating a key with a different body returns 409 IDEMPOTENCY_KEY_REUSED
      and the rule in force is unchanged.', 'SS-025.4: a repeat of a save that created a Monday 16:00 – 18:00 rule is answered
      as saved, not refused as overlapping that rule.', 'SS-025.5: two changes with different keys by two users are both
      applied and the change history holds two entries, each with its own actor and before and after values.']
