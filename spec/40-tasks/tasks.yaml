- id: T-207
  title: Build the shared idempotency library with per-module key tables and a request guard
  type: backend
  status: approved
  version: 1
  approved_with: {SS-014: 1}
  epic: EP-06
  feature: FT-06.1
  implements: [SS-014]
  traces_to: [REQ-103, REQ-236]
  kyiv: K
  description: 'Create the shared library `libs/idempotency` in `backend/src/libs/idempotency/` (a library, not a module:
    it has no schema of its own; add `backend/src/libs/` to the allowed shared paths of the dependency-boundary lint of
    batch 5''s T-998). It gives each module a migration template for its own `idempotency_key` table in the module''s schema
    (key, principal, request hash, state in-progress | done, stored response, created at), kept in PostgreSQL and not the
    cache, so the key row and the state change commit in one transaction (A-005; design.md §2.5 lists the cache as a candidate
    to drop). It provides a NestJS guard and interceptor for state-changing routes that reads the `Idempotency-Key` header
    and a plain API for in-process callers (Messaging passes the provider message id, workflow activities pass workflow
    id + step; code conventions row 8). Rules: same key and same request hash returns the stored response; same key with
    another request hash is 409 IDEMPOTENCY_KEY_REUSED as RFC 9457 problem details (code conventions row 7); a second request
    while the first with that key is in progress waits on the key row and then gets the first result; no key on a guarded
    route is IDEMPOTENCY_KEY_REQUIRED. Keys are kept at least 7 days (A-035, design.md §8); purging older keys is out of
    scope. Unit tests beside the code; the integration tests below run on real PostgreSQL with a fixture command. Out of
    scope: applying the guard to routes (T-105 capacity rules, T-129 booking commands, and every task that adds a state-changing
    route), inbound message de-duplication (SS-309) and webhook event ids (SS-218, SS-317).

    '
  acceptance_criteria: ['SS-014.3 (library row of the parameterised test case; the booking-route row is T-129''s): integration
      test on PostgreSQL with a fixture command: a stored key sent with another request hash returns 409 IDEMPOTENCY_KEY_REUSED,
      the command is not run and nothing it would write exists.', 'SS-014.5 (library row of the parameterised test case;
      the hold-route row is T-129''s): two concurrent calls with the same key on a fixture command run the command once
