  description: 'In booking/arrival, consume booking.released (T-332) once per booking (unique fee_decision row per booking).
    The exclusions are the fee_exclusion rows of T-303 (rebooked, station hold failed, site full, site faulted, grace timer
    late, late cancellation), a booking history entry with MOVED_CHARGER_FAULT, MOVED_MAINTENANCE, MOVED_SITE_FULL, MOVED_SESSION_NOT_STARTED
    or REBOOKED_BY_OPS (rebooked), and a reminder reported undelivered, read from the notifications module''s delivery status
    of the booking''s reminder (SS-307 clauses 1 and 2). With none it requests exactly one no-show fee line from the Ledger
    & invoicing component (SS-401 clause 1) at the fee amount and station share fixed at confirmation (SS-027 clause 3;
    an explicit zero is passed as is). With any it requests nothing and raises ''fee decision'' (SS-219 clause 1) naming
    each exclusion. Add POST /v1/ops/bookings/{bookingId}/fee-decision (create or waive, reason code, Idempotency-Key),
    ops only, in the versioned API description (SS-432): create requests one line at the fixed terms (FEE_CREATED), waive
    requests none (FEE_WAIVED); both record the ops user, reason code and time and report the exception resolved; without
    a reason code it is refused and the booking stays in the queue. Q-002 (payer undecided; the line exists in every option),
    Q-005. Out of scope: reversals and waivers of a posted line (SS-402).

