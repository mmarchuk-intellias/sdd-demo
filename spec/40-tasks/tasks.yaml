- id: T-316
  title: Run the station-hold step and send site-staff requests to the attendant view
  type: backend
  status: approved
  version: 1
  approved_with: {SS-118: 1}
  epic: EP-02
  feature: FT-02.3
  implements: [SS-118]
  traces_to: [REQ-020, REQ-026, REQ-027]
  kyiv: K
  description: 'In booking/station-hold, implement the step the booking workflow calls at the Station-hold offset (SS-032
    clause 4): runStationHoldStep(bookingId, dueAt, firedAt, stepKey). It does nothing for a booking cancelled or released
    before the offset; calls checkBeforeStationHold (T-306) so an EVSE in use is reallocated, or the booking handed to site-full
    handling, before anything is sent, and sends nothing for an EVSE in use; reads the site''s hold mode through a port
    (normal by default; manual mode T-322, degraded mode T-326); reads the EVSE''s reservable flag (SS-029 clause 3) and,
    for an EVSE not flagged reservable, creates a site-staff station-hold request: the stall to mark, the time to mark it
    (when sent) and the time to clear it (the booking''s end of grace, T-303), the system as actor, a short request code,
    recorded in the station-hold record (T-304). Charger reservations are T-317. Requests go to the attendant view, the
    default channel; the per-site SMS channel is T-319. For the attendant-view channel add to the dispatcher''s public interface
    siteStaffItems(siteId) (the site''s open requests and clear instructions), recordDelivered(itemId, at) and recordAcknowledged(requestId,
    staffMemberId, at), and emit booking.site_staff_item_issued for each request and clear instruction; the attendant view''s
    HTTP routes, live update and site-staff session check call these (batch 3''s T-545, SS-228 clauses 2 – 5; sessions SS-324),
    so this task adds no HTTP route. Delivery and acknowledgement are recorded with their times; an acknowledgement marks
    the station hold placed (STATION_HOLD_PLACED, the staff member as actor). A request carries only the vehicle''s plate
    and the charging driver''s first name (A-053). A-012, A-046, A-048. It binds this step to the booking workflow''s activity
    port in `backend/src/workflows/booking/activities/` (batch 1''s T-161, SS-032 clause 4), replacing the stub there; nothing
    else in the workflows module changes. Out of scope: SMS (T-319), the delivery timeout (T-320), clearing (T-321), the
    attendant view''s routes and screen (SS-228, T-545).

    '
  acceptance_criteria: ['SS-118.1: integration test: at the Station-hold offset, for an allocated booking on an EVSE not
      flagged reservable at a site not in manual mode, one site-staff request is created naming the stall, the time to mark
      it and the time to clear it (the booking''s end of grace), with the system as actor.', 'SS-118.3: integration test:
      at an attendant-view site the open request is returned by siteStaffItems for that site only, recordDelivered records
      delivery with its time, and recordAcknowledged is taken as the request''s acknowledgement.', 'SS-118.4: integration
      test: an acknowledgement is recorded with its time and actor and marks the booking''s station hold placed (STATION_HOLD_PLACED).',
    'SS-118.6: integration test: a booking cancelled, and one released, before its Station-hold offset gets no site-staff
      request.', 'SS-118.7: integration test: when the allocated EVSE is occupied at the step and no other EVSE is free,
      no request is sent for that EVSE and the booking is left to site-full handling.', 'SS-118.9: contract test: the request
      payload and its message template carry only the vehicle''s plate and the charging driver''s first name as driver data,
