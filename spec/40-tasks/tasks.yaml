  description: 'In booking/allocation, add the ops endpoints POST /v1/ops/rebooking-proposals/approve (proposal ids, one
    Idempotency-Key, BULK_PROPOSAL_APPROVED) and POST /v1/ops/rebooking-proposals/{proposalId}/reject, ops role only (constitution
    SC3), described in the versioned API description (SS-432). Approval handles each proposal in its own transaction: if
