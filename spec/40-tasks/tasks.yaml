- id: T-134
  title: Decide hold and confirmation requests per site in the order they reached the platform
  type: backend
  status: approved
  version: 1
  approved_with: {SS-007: 1}
  epic: EP-01
  feature: FT-01.5
  implements: [SS-007]
  traces_to: [REQ-102]
  kyiv: K
  description: 'In the `booking` module, make hold and confirmation decisions single-writer per site in received order (ADR-006):
    an ingress middleware stamps each request with a value of the PostgreSQL sequence `booking.edge_sequence` and the receive
    instant when it reaches the API process (the point A-032 measures from; for callers that do not come through HTTP the
    public `takeEdgeStamp()` gives the stamp, and Messaging passes the stamp its inbound-message pipeline took when it accepted
    an SMS (batch 4''s T-706); an in-process call without a stamp is stamped when it reaches the booking module); requests
    are queued per site (`booking.site_request`) and the holder of the site''s advisory lock decides the queued requests
    of that site in sequence order and hands each its result. Sites never wait on each other. Losers get the same-site offer
    of T-125 in received order, or SLOT_FULL; never a 5xx. Out of scope: latency measurement (T-135), the load test (T-136).

    '
  acceptance_criteria: ['SS-007.1: with an artificial delay injected into the earlier request''s ingress-to-queue path,
      two requests for the last unit of a slot are decided in edge-sequence order and the earlier one wins.', 'SS-007.2:
      20 concurrent requests for a slot with 3 units left: 3 holds are placed and each of the 17 others gets a same-site
      offer or SLOT_FULL, none a 5xx or a timeout.', 'SS-007.3: concurrent requests for different slots that each have room
      are all granted, whatever their arrival order.', 'SS-007.4: three requests losing the same slot get offers in received
      order: the first the earliest free slot, the second the next one after it, and the third the next or SLOT_FULL.',
