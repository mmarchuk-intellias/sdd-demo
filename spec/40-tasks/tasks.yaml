    interface (T-500) whether or not webhooks arrive, and applies each returned status through `applyStatusEvent` with the
    fetch time as observed-at and source CSMS poll; a result equal to the held status restarts the age and publishes no
    event (T-501). A failed poll is passed to the freshness recorder (T-504). Activities are idempotent, keyed by workflow
    id and step (code convention 8). Q-061 (vendor rate limits) may change the default value only. Out of scope: vendor
    clients (T-519, T-523), stale and feed detection (T-506), metrics (T-504).

