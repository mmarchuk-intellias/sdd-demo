  kyiv: K
  description: 'In booking/station-hold, read the site''s staff request channel and staff number from Inventory & site configuration
    (SS-026 clause 10, added at Gate 4; batch 1''s T-101 and T-102: attendant view by default, the number set by ops in
    E.164, design.md §8), the values in force when a request is sent; ops change them there, and the configuration audit
    records the change. For an SMS site, send each station-hold request, and later each clear instruction (T-321) and new
    clear time (T-324), through the notifications module''s public sendMessage (batch 4''s T-700) to the site''s registered
    staff number. The texts are message keys this task adds to the notifications template catalogue (batch 4''s T-702, with
    EN, ES and BN texts as its loader requires) for the request, the clear instruction and the new clear time, with the
    stall, the times and the request code; driver data is limited to plate and first name (A-053), and the message is sent
    without a booking id so the renderer adds no driver-page link or booking code (SS-118 clause 9). The language is the
    one stored for the staff number, English when none is (A-042, T-701). The task counts a request delivered on the provider''s
    delivery report (SS-307 clauses 1 and 2) and takes an inbound SMS from that number containing the request code as its
    acknowledgement (inbound messages deduplicated by provider message id, SS-309 clause 1). The reply reaches the dispatcher
    through the notifications module''s registerNumberHandler (built by batch 4''s T-706 for this purpose): this task registers
    each site''s staff number with it, so the message skips the driver and unregistered-number paths (SS-312 clause 5);
