- id: T-515
  title: Mark silent EVSEs unknown and out of allocation, and bring them back
  type: backend
  status: approved
  version: 1
  approved_with: {SS-204: 1}
  epic: EP-05
  feature: FT-05.2
  implements: [SS-204]
  traces_to: [REQ-169]
  kyiv: Y
  description: 'Extend the `site-status:<siteId>` monitor (T-506) with the silence rule. Per EVSE of a connected site the
    silence clock starts at the later of its last receipt and the end of the site''s last feed outage, and runs only while
    the site''s feed is available (the negation of SS-203 clause 1). When it reaches the site''s "Silence time" (design.md
    section 8, default 5 min, per site, SS-026 clause 1), set the status to unknown with exclusion reason silence and raise
    one ''silent EVSE'' exception (T-507, EVSE level) with site, EVSE and last-heard time. The read (T-505) then returns
    status unknown together with the last observed status and its own observed-at, which reconciles SS-202 clause 4 (the
    site''s status source stops reporting: a feed outage, SS-203, during which the silence rule is not applied, SS-204 clause
    4) with SS-204 clause 1 (one EVSE silent while the site''s feed is available). The rule is not applied during a feed
    outage nor at attendant-view sites. A later non-faulted report is applied and returns the EVSE at once, unless it was
    excluded after a fault before falling silent (then T-514''s rule applies); a faulted report goes to fault intake (T-512).
    Out of scope: bookings already allocated to the EVSE (SS-104). How a lost charger connection is reported is Q-061 (2);
    the rule works on absence of status and does not depend on it.

    '
  acceptance_criteria: ['SS-204.1: workflow test: an EVSE with no status for the configured silence time while the rest
      of the site reports is set to unknown and excluded from new allocations.', 'SS-204.2: workflow test: setting an EVSE
      to unknown under the silence rule raises one ''silent EVSE'' exception with the site, the EVSE and its last-heard
      time.', 'SS-204.3: workflow test: the EVSE staying silent for a further hour raises no further silent-EVSE exception.',
    'SS-204.4: workflow test: during a site feed outage no EVSE is set to unknown, and after recovery the silence clock
