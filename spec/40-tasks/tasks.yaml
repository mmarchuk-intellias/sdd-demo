    only (T-310) each affected booking with its recorded outcome: rebooked from which EVSE to which, or handed to unplaced
    handling with the alternatives offered (or none) and its final outcome once recorded. Add POST /v1/ops/bookings/{bookingId}/undo-fault-rebooking
    (reason code, Idempotency-Key), ops role only, both in the versioned API description (SS-432): it returns the booking
    to its original EVSE at its original time, records REBOOKING_UNDONE with the ops user and reason, and emits booking.reallocated
    so the driver is told and the station hold follows. Refusals, each leaving the booking as rebooked: UNDO_EVSE_OUT_OF_POOL
