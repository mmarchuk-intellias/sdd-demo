    at each refresh, so driver data anonymised or purged in the platform leaves the copy within one refresh interval (SS-336,
    SS-337; Gate 4 check). The page shows the time of the last complete refresh and an out-of-date notice when it is older
    than the interval. Reads of driver numbers through the endpoint are recorded by the personal-data access log (SS-335).

