  kyiv: K
  description: 'In booking/station-hold, react to booking.released (contract T-303, emitted by T-332), the Booking engine''s
    booking-cancelled event (SS-013 clause 5; force-releases of SS-016 clause 3 included) and booking-rebooked or booking.reallocated.
    For every site-staff request of the booking, send one clear instruction for that stall on the request''s channel (attendant
    view, or SMS through T-319) within the site''s Clear-instruction time (default 2 min). For every charger reservation,
    request its cancellation through the CSMS interface (SS-217 clause 1; AMPECO''s retries are SS-212 clause 8) and record
    each result (T-304). On the result "cancellation unconfirmed", raise ''station hold not cleared'' (SS-219 clause 1)
    and leave the booking''s new state as it is; a clear instruction not delivered within the Site-staff delivery timeout
    (timer of T-320) raises the same exception. A booking with recorded arrival is not released, so it gets no clear at
    the end of grace; a booking cancelled before any station hold was requested gets nothing. Each site-staff request is
    matched by exactly one clear instruction (unique constraint). Station holds sent before a switch to manual mode are
    cleared here. A-012, Q-009. Out of scope: the manual-mode list''s "clear now" marks (T-323).

    '
