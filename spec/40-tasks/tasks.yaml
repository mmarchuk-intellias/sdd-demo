  kyiv: K
  description: 'Create `backend/src/modules/evse-status` with schema `evse_status` (EVSE status service, design.md section
    2.6; module boundaries per code convention 4). Migration: `evse_current_status` (evse_id, status, observed_at, source,
    last_heard_at, excluded_reason null|fault|silence) and `applied_status_event` (dedupe key: provider event id, or EVSE
    + status + source + observed-at; kept at least 7 days, A-035). Public interface `applyStatusEvent` takes a NormalisedStatusEvent
    from the CSMS integrations or the attendant path, makes it current only if its observed-at is later than the held one,
    records its source (CSMS webhook, CSMS poll, attendant), and in the same transaction publishes one `evse-status.status-changed`
    domain event (EVSE, previous and new status, observed-at, source) through the module''s transactional outbox (platform
    database layer, T-906) when the value changes. Every valid receipt, duplicate or late included, restarts last_heard_at;
    status age is now minus last_heard_at (A-031; this is the reading of SS-200 clause 6, see tasks-log-3 NEW-Q-3). Add
    the site status-source resolver (the site''s CSMS integration from its CSMS kind, or the attendant view for a site with
    none) used by T-502, T-505 and T-515. Validation and vendor mapping stay in the integrations (SC7). Out of scope: polling
    (T-503), the read model (T-505), history (T-516), source gating (T-502). T-900''s scaffold has no folder for this module:
    this task creates it with `public/` and `internal/` as the scaffold lays out the others (placement is an open Phase
    0 decision, design.md §9). Add the `evse_status.idempotency_key` table from the migration template of T-207''s idempotency
    library for the module''s state-changing routes (T-513, T-514, T-517); each of them takes an Idempotency-Key through
    the library''s guard (code convention 8, A-035).

    '
