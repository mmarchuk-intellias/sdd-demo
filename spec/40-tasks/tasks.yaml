- id: T-318
  title: Fall back to site staff when a charger reservation is rejected or unanswered
  type: backend
  status: approved
  version: 1
  approved_with: {SS-117: 1, SS-121: 1}
  epic: EP-02
  feature: FT-02.2
  implements: [SS-117, SS-121]
  traces_to: [REQ-023, REQ-154, REQ-155]
  kyiv: K
  description: 'In booking/station-hold, handle the typed results of a charger reservation from the vendor-neutral CSMS
    interface (SS-217 clause 1; for AMPECO, SS-212 clauses 2 to 4). Accepted: record it and mark the station hold placed
    (STATION_HOLD_PLACED). Rejected while the EVSE''s last known status (SS-202) is not in use: send the site-staff request
    of T-316 for that stall and raise ''charger reservation failed'' (SS-219 clause 1). Not answered within the site''s
    Reservation answer timeout (default 60 s): the same, with the exception marked unanswered. Rejected while the EVSE is
    in use: no site-staff request; report to Allocation & rebooking (onReservationRejectedInUse, T-306). A late acceptance
    after the fallback is recorded and the site-staff request stays, so both are cleared when the booking ends (T-321).
    Every rejection writes an audit event (SS-332 clause 1) with the system as actor and the reason code CHARGER_RESERVATION_REJECTED
    from the reason-code catalogue of the booking module (`backend/src/modules/booking/`, batch 1''s T-122), which SS-020''s
    notes list since v2 (Gate 4). The booking''s state, allocation, grace and release never change on any of these results.
    Both attempts are recorded in order (T-304). Q-060: a reservation AMPECO cannot hold to the end of grace comes back
    rejected and falls back here. Out of scope: AMPECO''s own timeout and retry mechanics (SS-212).

    '
  acceptance_criteria: ['SS-117.1: integration test: a rejection while the EVSE''s last known status is not in use creates
      a site-staff request for that EVSE''s stall and raises one ''charger reservation failed'' exception for the booking.',
    'SS-117.2: integration test: a ''not answered'' result after the Reservation answer timeout creates the site-staff request
      and raises the exception marked unanswered.', 'SS-117.3: integration test: a rejection while the EVSE is occupied
      creates no site-staff request and calls onReservationRejectedInUse once.', 'SS-117.4: integration test parameterised
