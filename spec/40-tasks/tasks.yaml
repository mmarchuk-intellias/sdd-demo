- id: T-355
  title: Anonymise and purge the driver data of arrival, station-hold and dispute records
  type: backend
  status: draft
  version: 1
  epic: EP-13
  feature: FT-13.4
  implements: [SS-337, SS-336]
  traces_to: [REQ-125, REQ-233]
  kyiv: K
  description: 'In the `booking` module (`backend/src/modules/booking/`, the arrival and station-hold folders of batch 2,
    which hold the module''s driver personal data), the anonymisation and purge handlers for: the arrival evidence of each
    booking (T-303; arrival events only, A-024), pending QR scans with their device cookie id (T-353), running-late reports
    (T-334), blocked-stall reports (T-338), no-show disputes with their raiser and statements (T-341, T-354) and the payload
    of site-staff requests, which carries the charging driver''s first name (T-316, A-053). Holds, bookings, offers, allocations
    and the state-change history refer to drivers by internal id only and are never changed. Anonymisation replaces the
    driver''s first name and any number in these records with the pseudonym and deletes the driver''s device cookie ids;
    the purge acts on records whose period has ended and, for each, names its booking, so the run keeps what an open dispute
    or a running dispute window needs (SS-336 clause 4). It implements the handler contract of the audit module (batch 4''s
    T-789: list the records whose retention period has ended and delete or pseudonymise them when the retention run asks;
    replace one driver''s personal data with the pseudonym the anonymisation passes, T-791). Both handlers are idempotent,
    so the post-restore step can re-apply them (T-790), and never delete a booking, an audit entry or a ledger entry (SS-336
    clause 3). They are registered with the contract, and each field they handle has its data-register entry with class
    and retention ''not set'' until counsel sets it (SC4, A-025, Q-022), so T-789''s CI check finds a handler for every
    entry with a period. Logs carry ids only (SC5). Q-058 is open (whether evidence for an open no-show dispute is kept
    or anonymised at once): until it is answered the anonymisation endpoint refuses a driver with an open dispute (T-791),
    so this handler never removes evidence a dispute needs. Added at Gate 4 (P4.2 critique NEW-Q-P2-1); it sits in batch
    2''s range because the records it handles are batch 2''s.

    '
  acceptance_criteria: ['SS-337.1 (booking part): integration test: the booking module''s anonymisation handler, called
      for a driver with an arrival by QR scan, a pending scan, a running-late report, a blocked-stall report, a decided
      dispute and a site-staff request, leaves no first name, number or device cookie id of the driver in those records,
      puts the pseudonym in their place, and keeps every booking, allocation and state-change entry with its internal driver
      id.', 'SS-336.2 (booking part): integration test: with test retention periods set, the booking module''s purge handler,
      asked by the run, deletes or pseudonymises the arrival evidence, pending scans, running-late and blocked-stall reports
      and site-staff request payloads whose period has ended, names the booking of each record it returns, and deletes no
      booking, allocation or state-change entry.']
  needs: [SS-336.3]
  depends_on: [T-303, T-316, T-334, T-338, T-341, T-353, T-354, T-789]
  blocks: []
  estimate: null
  labels: ['blocked-by:Q-058']
- id: T-500
  title: Define the vendor-neutral CSMS interface, capability registry and fake integration
  type: integration
  status: approved
  version: 1
  approved_with: {SS-217: 1}
  epic: EP-05
  feature: FT-05.1
  implements: [SS-217]
  traces_to: [REQ-105]
  kyiv: K
  description: 'Create `backend/src/integrations/csms` (CSMS integrations, design.md section 2.4, ADR-003, code conventions
    4 and 5): the vendor-neutral CSMS interface the core modules use, with platform types only: NormalisedStatusEvent (EVSE
    id, platform status available|occupied|charging|faulted|unknown, observed-at, source, provider event id), PollRequest
    and PollResult (statuses, or failed), ChargerReservationRequest and its typed results, SessionStartEvent, SessionRecord,
    and CapabilityDeclaration (statusWebhook, statusPoll, chargerReservation, sessionStart, sessionRecords). Add the CSMS
    integration registry (started through the platform''s integration registry of T-900), which resolves a site''s integration
    from the site''s CSMS kind held by Inventory & site configuration and routes every call by declared capability; an undeclared
    capability returns NOT_SUPPORTED without any vendor call. The simulator integration (T-555) registers through the same
    registry. Add a configurable fake CSMS integration under `backend/test/fixtures/csms-fake` (emits or drops status events,
    answers or fails polls, accepts, rejects or ignores reservations, emits session starts) for the core suites of this
    batch. Add to the dependency-boundary lint of T-901 (SS-427.3) the import-boundary rules: core modules import only the
    `integrations/csms` public entry point; CSMS vendor packages and vendor folders are importable only inside their own
    `integrations/<vendor>` folder. Out of scope: vendor clients (T-519, T-520, T-523), webhook verification (T-526), the
    simulator integration (T-555), the switch proof (T-527).

    '
  acceptance_criteria: ['SS-217.1: lint fixture test: a core module importing the `integrations/csms` entry point passes
      and one importing from `integrations/ampeco` or another vendor folder fails the pipeline lint; a type test asserts
      the entry point exports only the listed neutral types.', 'SS-217.2: lint fixture test: importing a listed CSMS vendor
      SDK or package from any folder other than its own `integrations/<vendor>` fails CI, and the same import inside that
      folder passes.', 'SS-217.3: unit test: the registry accepts an integration only with a declaration of all five capabilities
      and returns each registered integration''s declaration; an integration with a missing capability is refused at registration.',
