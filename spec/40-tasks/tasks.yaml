    offer carries (MOVED_CHARGER_FAULT, MOVED_MAINTENANCE, MOVED_SITE_FULL), releases its capacity in the original slot,
    records no no-show, records the accepted site''s parameter and terms versions in force at that instant and writes one
    booking-rebooked event (timers follow it, T-162; the old station hold is cleared by SS-120). The rebooking is the public
    interface `rebookBooking(bookingId, siteId, start, reasonCode, actor)` of the booking module: it re-checks cap and pool
    at that moment (T-124, T-126) and answers SLOT_FULL or NO_COMPATIBLE_EVSE_FREE when the target no longer fits; batch
    2''s ops rebooking (T-312) and approved proposals (T-311) call it with the ops user as actor. Out of scope: the allocation
