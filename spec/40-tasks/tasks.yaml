  description: 'In backend/src/platform/events, on the database layer of T-906: an outbox table in each module''s schema,
    written in the same transaction as the state change through a publish(tx, event) helper; a dispatcher in the worker
    role that reads committed outbox rows in order per module and delivers each domain event to its registered consumers
    at least once; a consumer registry in which a module declares the event types it handles from the publishing module''s
    public event contracts; deduplication by event id in a processed-event table in the consumer''s own schema, so a redelivery
    after a crash has no second effect; delivered rows kept for at least 7 days (A-035). The dispatcher runs under its own
    database role, granted only on the outbox tables, so no module reads another module''s schema. Out of scope: any module''s
    events (their tasks) and the notifications module''s hand-off to the messaging provider.

