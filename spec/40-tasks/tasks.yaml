    allocation overlaps (the constraint of T-300 included), UNDO_AFTER_ARRIVAL when arrival is recorded (T-303), UNDO_NOT_ALLOWED
    when the named rebooking was not an automatic fault rebooking, and the catalogue refusal for a missing reason code.
