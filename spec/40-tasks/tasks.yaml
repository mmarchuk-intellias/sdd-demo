- id: T-301
  title: Choose the EVSE for an allocation - compatible, free, lowest sufficient power
  type: backend
  status: approved
  version: 1
  approved_with: {SS-101: 1}
  epic: EP-02
  feature: FT-02.1
  implements: [SS-101]
  traces_to: [REQ-013, REQ-016, REQ-020]
  kyiv: K
  description: 'In booking/allocation, implement the EVSE selector every allocation and reallocation uses (T-302, T-306,
    T-307, T-311, T-312, T-339, T-340). Inputs: the booking''s vehicle and time range (T-300); the site''s EVSEs compatible
    with the vehicle as the Booking engine returns them for allocation (SS-004 clause 4: native connector or allowed adapter,
    the vehicle''s override over the fleet policy; maintenance-held EVSEs already left out, SS-017 clause 1); each EVSE''s
    last known status and its exclusion from new allocations from the EVSE status service (SS-202); each EVSE''s maximum
    power (SS-030); the vehicle''s maximum DC charging power (SS-038). An EVSE is free only when its last known status is
    available, it is not excluded from new allocations, it is not maintenance-held for the slot and no active allocation
    on it overlaps the booking''s range. Among free compatible EVSEs the selector picks the lowest maximum power that meets
    the vehicle''s maximum DC power, else the highest; ties are broken by EVSE id so results are deterministic. A booking
    with no vehicle has no compatible EVSE (A-061, CR-009). The selector is a pure function plus a read adapter and writes
    nothing. Out of scope: allocation writes and events (T-302); stale-feed exceptions (SS-203); an accessible-EVSE rule
    (Q-050, in no SS).

    '
