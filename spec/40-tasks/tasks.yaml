- id: T-124
  title: Place holds on the site's grid with the cap check, the hold time and typed refusals
  type: backend
  status: approved
  version: 1
  approved_with: {SS-002: 1, SS-001: 2}
  epic: EP-01
  feature: FT-01.2
  implements: [SS-002, SS-001]
  traces_to: [REQ-001, REQ-002, REQ-004, REQ-028, REQ-145, REQ-152]
  kyiv: K
  description: 'In the `booking` module, add `POST /v1/holds` (site, local start or instant, duration, vehicle; charging
    driver and manual state of charge are added by T-131 and T-190) and the internal predicate `wouldAcceptHold(site, start,
    duration, vehicle, at)` that T-125, T-133 and T-137 reuse. Checks in order: site bookable (T-100), start on the site''s
    time grid (T-121), duration among the site''s booking durations, start inside bookable hours (T-103), start not yet
    passed when the request is received (SS-001 clause 10), and for every grid slot the booking covers, unexpired holds
    plus active bookings (Confirmed until it ends, not cancelled, released or a no-show) plus the new hold below the cap
    of the rule in force for that slot (T-103). A hold counts until its expiry instant whatever its timer does. Decisions
    for one site run under the site''s transaction-scoped advisory lock (T-120); received order and offers to losers are
    T-134 and T-125. A placed hold expires at the site''s hold time (parameters: time grid, booking durations, hold time)
    and writes a hold-placed event. Refusals are typed results with codes OFF_GRID, DURATION_NOT_OFFERED, OUTSIDE_BOOKABLE_HOURS,
    SITE_NOT_BOOKABLE, START_TIME_PASSED, SLOT_FULL (the offer on SLOT_FULL is T-125). A start time that has already passed
    is refused with START_TIME_PASSED (SS-001 clause 10, added at Gate 4), unless the request comes through the ops booking
    path with the reason code OUTAGE (T-143, SS-015 clause 4), which passes an ''outage'' flag to these checks; `wouldAcceptHold`
    applies the same check at its `at` instant, so the open-slot query offers no past start time (T-133). Out of scope:
    compatibility (T-130), parties (T-131), vehicle checks (T-132), manual-hold units in the count (T-145, T-146), idempotency
    (T-129). Routes are versioned and published in the API description (batch 5''s T-911, SS-432), and each declares its
    permission in the identity role matrix, enforced by the deny-by-default guard that defines the ops and partner roles
    (batch 5''s T-909, SS-440 clause 1).

    '
  acceptance_criteria: ['SS-002.1: a hold request on the grid with a configured duration at a site with room returns a hold
      that counts against the cap of each covered slot and expires exactly the site''s hold time after placement.', 'SS-002.2:
      a request for 16:05 at a 15-minute-grid site is refused with OFF_GRID and no hold row exists.', 'SS-002.4: with cap
      5, three unexpired holds and two confirmed bookings overlapping 16:30, a new hold covering 16:30 is refused, and with
      one of the holds expired it is accepted.', 'SS-002.5: a 45-minute booking from 16:45 crossing from a cap-5 rule (until
      17:00) to a cap-3 rule is accepted only while both the 16:45 slot is below 5 and the 17:00 and 17:15 slots are below
