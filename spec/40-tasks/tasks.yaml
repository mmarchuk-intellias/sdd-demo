  kyiv: K
  description: 'In backend/src/integrations/stripe, submitInvoice of the payment-provider interface (T-955): finds the fleet''s
    Stripe customer by metadata platform_fleet_id, else uses the customer id held for the fleet in the integration''s own
    table (rows for pilot fleets loaded from a reviewed file by an ops pipeline job if Amperlane chooses to keep today''s
    billing records, Q-067), else creates one from the fleet''s billing contact (Fleet & vehicles, SS-040) with that metadata;
    creates the invoice with one item per invoice line, the issue and due dates, collection_method send_invoice and metadata
    platform_invoice_id, then finalises and sends it, each call with an idempotency key derived from the platform invoice
    id and the step; on acceptance records the Stripe invoice id and the hosted invoice page link; an invalid-request answer
    stops the submission with Stripe''s error code kept for the finance view. A zero-total invoice is not submitted and
    is recorded as paid at zero (fallback for Q-062 (1), SS-404 notes). Contract tests use Stripe test mode with recorded
    fixtures. Out of scope: pending state and retries (T-957), webhooks (T-958).

