  kyiv: K
  description: 'In booking/arrival, implement the step the booking workflow calls at the end of grace (SS-032 clause 4):
    runEndOfGraceStep(bookingId, dueAt, firedAt, stepKey). It first calls the dispatcher''s finaliseAtEndOfGrace (T-304);
    then, if no arrival is recorded (T-303), it releases the booking through the Booking engine as NoShow with the system
    as actor and RELEASED_NO_ARRIVAL (SS-020 clause 1), deactivates its allocation (T-302) so its capacity returns to the
    slot calendar, and emits one booking.released for clearing (T-321) and the fee decision (T-336). If arrival is recorded
    it changes nothing, also when the timer fires late. When firedAt is later than dueAt by more than the platform-wide
    Timer lateness tolerance (default 60 s), it releases once and records the "grace timer late" mark and fee exclusion
    (T-303). Ops extensions move the timer (the workflow reschedules on booking.grace_extended, SS-032 clause 7). A replayed
    step changes nothing. It binds this step to the booking workflow''s activity port in `backend/src/workflows/booking/activities/`
    (batch 1''s T-161, SS-032 clause 4), replacing the stub there; nothing else in the workflows module changes. Same rule
    at every supply pattern, each booking with its own site''s values. A-003, A-028, constitution N5.

    '
  acceptance_criteria: ['SS-127.2: integration test: at the end of grace with no arrival the step records NoShow with the
