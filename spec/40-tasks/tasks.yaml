- id: T-706
  title: Process each inbound message once by provider message id, marked processed with its effect
  type: backend
  status: approved
  version: 1
  approved_with: {SS-309: 1, SS-317: 1, SS-007: 1}
  epic: EP-06
  feature: FT-06.2
  implements: [SS-309, SS-317, SS-007]
  traces_to: [REQ-090, REQ-102, REQ-260]
  kyiv: K
  description: 'In `notifications`, add the `inbound_message` table (unique provider message id, sender, channel, received-at,
    processed-at) and the inbound pipeline fed by the webhook after signature verification (T-705). The id is marked processed
    in the transaction that commits the message''s own effect or reply; calls into other modules (holds, bookings, cancellations,
    reports) carry the provider message id as idempotency key (constitution N8, code convention 8; SS-014), so a redelivery
    after a failure is safe. When the pipeline accepts a message from the webhook, in the webhook''s request and before
    any queueing, it takes the booking module''s edge stamp (`takeEdgeStamp()`, batch 1''s T-134) and stores it with the
    inbound message (a message found by the reconciliation read is stamped when that read accepts it); every hold or confirmation
    request the message causes passes the stamp along with the provider message id, so an SMS request is decided in the
    order it reached the platform, whatever its channel (SS-007 clause 1). Concurrent deliveries of one id are serialised
    on the unique key. Ids are kept for the idempotency-key retention (at least 7 days, A-035; design.md section 8, held
    by this SS). A reconciliation read of inbound messages from Twilio since the last one received runs as a Temporal schedule
    (N9, N10) and feeds the same pipeline. Before the inbound router (T-719), the pipeline offers each message to handlers
    other modules register for specific numbers (`registerNumberHandler`); a claimed message skips the driver and unregistered-number
    paths. The Station-hold dispatcher uses it for site-staff SMS replies (batch 2''s T-319, tasks-log-2 gap 2).

    '
  acceptance_criteria: ['SS-309.1: test delivers one inbound message by webhook and through the reconciliation read and
