  kyiv: K
  description: 'In `integrations/twilio`, add the inbound-message and status-callback webhook endpoints. Before reading
    the request further, verify Twilio''s request signature with the auth token from the managed secret store (constitution
    SC3, N14); a missing or failing signature is rejected with no processing, no reply and no state change (the security
    event for the rejection is T-784). Validate payloads against a schema at the edge (SC7). Status callbacks update the
    message''s latest status in `notifications`, applied once per provider message id and status and never replacing a final
    status (delivered, undelivered, failed) with an earlier one (queued, sent). A reconciliation read of message status
    from Twilio for messages with no final status runs as a Temporal schedule in the workflows code (constitution N9, N10)
    and applies the same rule. Inbound-message processing is T-706.

