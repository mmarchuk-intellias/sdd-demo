  kyiv: K
  description: 'In booking/allocation, add POST /v1/ops/bookings/{bookingId}/rebook (target site, slot start and, for an
    allocated booking, optionally an EVSE; reason code; Idempotency-Key), ops role only, in the versioned API description
    (SS-432). It checks the target against the rules of any booking: the cap and pool feasibility of the Booking engine
    (SS-002 clause 3, SS-003 clause 2), connector compatibility (SS-004 clause 1) and, for a named EVSE, the selector''s
    free test and the no-overlap rule (T-300, T-301). If they hold it rebooks the booking under its booking id through the
    Booking engine''s public rebookBooking (SS-011 clause 3, batch 1''s T-139) with the ops user as actor and REBOOKED_BY_OPS
    plus the ops reason, deactivates the old allocation, writes the new one when an EVSE was named, and emits booking.rebooked
    (or booking.reallocated for an EVSE change within the same slot), so the old station hold is cleared (T-321), the new
    one follows (T-316, T-317) and the driver gets the rebooking notice (SS-301 clause 8). Refusals carry the failing rule''s
    code, the catalogue refusal for a missing reason code (SS-020 clause 3), or EVSE_BEFORE_ALLOCATION for a named EVSE
    on an unallocated booking (REQ-003). The console screen is SS-222''s (batch 3). Out of scope: bulk proposals (T-311).

    '
  acceptance_criteria: ['SS-114.1: API test: an ops rebooking to another slot, to another site, and of an allocated booking
      to another EVSE, each passing the cap, pool, compatibility and no-overlap rules, keeps the booking id and records
      REBOOKED_BY_OPS with the ops user and the reason code.', 'SS-114.2: API test: each completed rebooking emits one booking.rebooked
      (booking.reallocated for an EVSE change in the same slot).', 'SS-114.3: API test parameterised over a full slot, a
