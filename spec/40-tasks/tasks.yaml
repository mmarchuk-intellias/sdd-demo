    only, in the versioned API description (SS-432). With a catalogue reason code it records FAULT_REBOOK_ALL_BY_OPS, has
    the EVSE status service record the EVSE as faulted by ops so it gets no new allocations until it returns to service
    (SS-208 clause 7 exclusion, SS-209 return), and emits booking.rebook_all_requested (EVSE, ops user, reason code, trigger
    id) through the booking module''s outbox, the ops trigger of the fault-rebooking saga (SS-036 clause 1, batch 1''s T-167).
    The saga calls T-307''s and T-308''s decisions with cause ''ops'' and the ops user as actor; each rebooking carries
    MOVED_CHARGER_FAULT and outcomes are recorded as in T-310. A booking already moved by a running fault rebooking is not
    rebooked again (T-307''s idempotency); on an EVSE whose interrupted saga left bookings with exceptions, exactly those
    bookings are handled and the saga reports their exceptions resolved (SS-036 clause 5). The EVSE is recorded as faulted
    by ops through the EVSE status service''s public command recordOpsFault(evseId, actor, reasonCode) (SS-208 clause 7,
