    requires an Idempotency-Key (code conventions row 8, library of T-207). Out of scope: screens (T-201); consumers keep
    reading values at use or from the booking''s version (T-101). Routes are versioned and published in the API description
    (batch 5''s T-911, SS-432), and each declares its permission in the identity role matrix, enforced by the deny-by-default
    guard that defines the ops and partner roles (batch 5''s T-909, SS-440 clause 1).

