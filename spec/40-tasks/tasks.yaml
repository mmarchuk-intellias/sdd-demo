    the notifications module''s sendRebookingNotice(bookingId) (SS-301 clause 8, batch 4''s T-715), and reports the exception
    resolved (SS-219 clause 7); otherwise it leaves the booking unchanged, marks it "not placed" in the queue (SS-219 clause
    8) and goes on with the other proposals. A proposal whose booking the driver already rebooked is refused with PROPOSAL_SUPERSEDED.
