      time, cancellation cut-off, silence time), a new site''s current parameters hold a value for each, and a stored version
      that lacks one fails schema validation.', 'SS-026.3: a site created with no site values gets the design.md §8 defaults,
      among them a grace period of 10 minutes, a 15-minute time grid, booking durations of 30, 45 and 60 minutes and a 3-minute
      hold time.', 'SS-026.5: with version 1 in force from 10:00 and version 2 from 11:00, asking for the parameters of
      a booking confirmed at 10:30 returns version 1, and of a booking confirmed at 11:05 returns version 2.', 'SS-026.10:
