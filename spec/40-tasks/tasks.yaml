      is reported resolved.', 'SS-105.4: integration test: moving the clock past the slot start with no acceptance leaves
      the booking on its slot with its mark and open exception, and the fee exclusion ''site full'' is recorded.', 'SS-105.5:
      integration test run with no ops session in the system: the offers are requested and the exception raised exactly
