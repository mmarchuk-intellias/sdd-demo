    release (Arrival & no-show, SS-128) creates a new booking for the offered slot with the same vehicle, duration, booker
    and charging driver if a hold would be accepted at that moment, and leaves the released booking a no-show (no fee created
    or waived, Q-003); an alternative offered after a fault, a maintenance hold or a full site (SS-105, SS-109, SS-113;
