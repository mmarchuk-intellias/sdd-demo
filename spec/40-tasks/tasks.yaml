  traces_to: [REQ-194]
  kyiv: K
  description: 'In `backend/src/workflows/evse-status`, start a child workflow `evse-return:<evseId>` when an EVSE is excluded
    for a fault. It counts the platform-wide "Stable-available time" (design.md section 8, default 30 min) from the first
    available report; any other status stops it and the count restarts from the next available report. At the end the exclusion
    is cleared and `evse-status.returned-to-service` is published, requesting no booking change. At an attendant-view site,
    a faulted-to-free setting left unchanged counts as available from its update time. In `backend/src/modules/evse-status`,
    add `POST /v1/ops/evses/{evseId}/return-to-service` (Amperlane ops role, Idempotency-Key through the guard of T-207''s
    idempotency library) that requires a reason code (RETURNED_TO_SERVICE in the SS-020 catalogue), returns the EVSE to
    the pool at once, records the ops user, reason code and time and writes the audit entry (manual ops action, N17), and
    refuses with REASON_CODE_REQUIRED without a code. The SS-209 GAP (ops returning an EVSE whose source still reports faulted)
    is not decided here: the endpoint returns it as REQ-194 allows. Out of scope: undoing fault rebookings (SS-111), the
    board button (T-528).

    '
