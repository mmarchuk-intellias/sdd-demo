- id: T-101
  title: Hold the per-site and platform-wide booking parameter catalogue as versions with defaults
  type: backend
  status: approved
  version: 1
  approved_with: {SS-026: 2}
  epic: EP-01
  feature: FT-01.7
  implements: [SS-026]
  traces_to: [REQ-034, REQ-146]
  kyiv: K
  description: 'In the `inventory` module, store the parameter catalogue of SS-026 with the names and defaults of design.md
    §8 (A-059 and the sources named there): table `site_parameter_version` (site id, version number, the 16 per-site values,
    the site-staff request channel and site-staff number, and the session-start arrival switch and its evidence of SS-026
    clauses 10 and 11 (added at Gate 4), valid from, actor) and `platform_parameter_version` (the 27 platform-wide values,
    valid from, actor). Values are typed and checked by one schema, in the units of design.md §8; the cancellation cut-off
    is stored as an offset whose default is the slot start (A-049). When a site is created, version 1 is written from the
    catalogue defaults. Public interface: the current parameters of a site, the version in force at an instant, a version
    by id (the booking records it at confirmation, T-127), and the current platform-wide values. The Station-hold dispatcher
    (batch 2''s T-319) and Arrival & no-show (T-329) read the current values of the clause 10 and 11 settings, not the version
    a booking was confirmed under; their defaults are attendant view with no staff number, and arrival from a session start
    off with evidence by status change (design.md §8, A-059, A-051). Client-decision values (fee terms T-106, capacity rules
    and bookable hours T-103) are not in this catalogue. Out of scope: the change API, the validation of changes and the
    parameter-changed event (T-102), the per-CSMS status poll interval (T-102), screens (T-201).

    '
