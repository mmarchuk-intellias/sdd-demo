  description: 'In the `inventory` module, add the ops endpoints `PUT /v1/sites/{siteId}/parameters`, `PUT /v1/platform-parameters/{name}`
    and `PUT /v1/csms-integrations/{kind}/parameters` (status poll interval per CSMS integration, default 20 s, design.md
    §8; read by the EVSE status service, SS-201). A per-site change writes a new version in force from that instant, with
    no deployment or restart; platform-wide and per-CSMS values are versioned the same way. Validation of SS-026 clause
    7 runs before anything is written. The site-staff request channel and number and the session-start arrival setting (SS-026
    clauses 10 and 11, added at Gate 4) are changed through the same per-site endpoint, as new versions with a parameter-changed
