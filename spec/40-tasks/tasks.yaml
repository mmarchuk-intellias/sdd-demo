  description: 'In the reporting module (read-only, backend/src/modules/reporting): endpoint GET /v1/ops/outage-copy, callable
    only by the refresher''s machine identity, returning per site every booking whose slot starts within the configured
    outage-copy horizon (default 12 h) with the charging driver, the driver''s contact number, the window and the allocated
    EVSE where there is one, plus a completeness marker listing every live site and the configured outage-copy refresh interval
    (default 5 min) and horizon (SS-026 clause 2, design.md section 8); assembled from the booking, allocation and fleet
    modules'' public interfaces. A refresher Lambda function in the resilience account, triggered every minute, refreshes
    when the interval has elapsed, validates completeness, writes the new copy and then switches the pointer (atomic replace);
