  kyiv: K
  description: 'Create the `inventory` module in `backend/src/modules/inventory/` (Inventory & site configuration, design.md
    §2.6; constitution code conventions row 4) with its own PostgreSQL schema `inventory` and forward-only migrations. Tables:
    `site` (id, station operator id, name, site code with a unique constraint, address, location as latitude and longitude,
    IANA time zone, supply pattern A/B/C, CSMS kind, live flag defaulting to false), `evse` (id, site id, external id per
    CSMS, label, reservable flag) and `connector` (id, EVSE id, type enum CCS1 | NACS, maximum power in kW as a fixed-scale
    decimal with a check that it is positive). Domain service and public interface for other modules: read a site, list
    a site''s EVSEs with their connectors and external ids, save an EVSE with its connectors (used by onboarding, T-108),
    and `isBookable(siteId)` from the live flag. Also create the module''s error-code catalogue (UPPER_SNAKE, code conventions
    row 6) and its domain-event contracts, published through the platform database layer''s transactional outbox (SS-427)
    in the same transaction as the change: `inventory.configuration_changed` (item, values before and after, actor, time;
    recorded by the configuration audit, SS-333), `inventory.capacity_rule_changed`, `inventory.bookable_hours_reduced`,
    `inventory.parameter_changed` and `inventory.site_went_live`, emitted by T-102 – T-109. Reads no configured parameter.
    Out of scope: the onboarding API and live marking (T-107, T-108), capacity rules (T-103), live EVSE status (EVSE status
    service), screens (T-200).

    '
