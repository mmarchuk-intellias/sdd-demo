- id: T-103
  title: Store capacity rules and bookable hours and validate that each bookable slot has exactly one cap
  type: backend
  status: approved
  version: 1
  approved_with: {SS-023: 1}
  epic: EP-01
  feature: FT-01.1
  implements: [SS-023]
  traces_to: [REQ-005, REQ-076, REQ-077]
  kyiv: K
  description: 'In the `inventory` module, add tables `capacity_rule` (site id, days of the week on which the window starts,
    window start and end in the site''s local time, cap on bookable EVSEs, valid from, actor) and `bookable_period` (site
    id, days of the week, start and end in local time). A window whose end is earlier than its start runs past midnight
    and belongs to the day it starts (SS-023 clause 4). Pure validation function: expand rules and bookable periods over
    a week in local minutes and check that every bookable minute is under exactly one rule and every cap is at most the
    site''s EVSE count; the result lists uncovered days and times and names overlapping rules. Public read interface: the
    bookable hours and the capacity rule in force for a site at an instant, evaluated in the site''s time zone (used by
    T-124, T-133). No HTTP endpoint here (saving is T-104). Data per site comes from the partner agreement (Q-005); overbooking
    stays off. Out of scope: save API, events and walk-up figures (T-104), idempotency (T-105), screens (T-202).

    '
  acceptance_criteria: ['SS-023.1: integration test: a site''s bookable days and hours and a set of rules, each with days
      of the week, a local window and a cap, are stored and read back unchanged.', 'SS-023.2: a rule set leaving Tuesday
      14:00 – 15:00 inside bookable hours uncovered is refused with that day and time listed; a rule set where two rules
      both cover Monday 16:00 – 17:00 is refused naming both rules; in both cases the rules and hours in force are unchanged.',
    'SS-023.3: a rule with cap 17 at a 16-EVSE site is refused and the rules in force are unchanged.', 'SS-023.4: a Monday
      rule 22:00 – 05:00 covers the Tuesday 00:00 – 05:00 slots; adding a Tuesday rule 00:00 – 05:00 is then refused as
      an overlap.', 'SS-023.6: with bookable hours 06:00 – 22:00 at an America/New_York site, the hours in force on 2027-03-14
      and 2027-11-07 (clock-change days) start at 06:00 and end at 22:00 local time.']
  needs: []
  depends_on: [T-100]
  blocks: [T-104, T-107, T-108, T-121, T-124, T-988]
  estimate: null
  labels: []
- id: T-104
  title: Save capacity rules and bookable hours in force at once, with walk-up figures and a reduced-hours event
  type: backend
  status: approved
  version: 1
  approved_with: {SS-023: 1, SS-024: 1}
  epic: EP-01
  feature: FT-01.1
  implements: [SS-023, SS-024]
  traces_to: [REQ-005, REQ-076, REQ-077, REQ-082]
  kyiv: K
  description: 'In the `inventory` module, add `PUT /v1/sites/{siteId}/capacity-rules` and `PUT /v1/sites/{siteId}/bookable-hours`
    for ops and for a station operator on its own sites (organisation scoping: batch 4''s T-742, SS-323 clause 3), and `GET
    /v1/sites/{siteId}/walk-up` (per window: cap, and walk-up EVSEs = the site''s EVSE count less the cap). A save validates
    with T-103 and puts the whole set in force from that instant, with no approval step; an invalid save puts nothing in
    force. Each save writes to the outbox one configuration-changed event (before and after values, for SS-333) and a capacity-rule-changed
    event; a save of bookable hours that removes hours writes a bookable-hours-reduced event naming the site and the removed
    periods (the Booking engine lists affected bookings, T-147). Nothing here changes or cancels a booking. Requires an
    Idempotency-Key (library of T-207); the replay behaviour specific to capacity rules is T-105. Out of scope: screens
    (T-202), the per-form key of the portal and console forms (SS-236, SS-237). Routes are versioned and published in the
    API description (batch 5''s T-911, SS-432), and each declares its permission in the identity role matrix, enforced by
    the deny-by-default guard that defines the ops and partner roles (batch 5''s T-909, SS-440 clause 1).

    '
  acceptance_criteria: ['SS-023.5: after an ops or station-operator save of bookable days and hours, the public read used
      by open-slot queries and holds returns the new hours for every instant from the save onward.', 'SS-023.7: a save that
      removes 22:00 – 24:00 at a site with a confirmed booking at 23:00 succeeds, writes one bookable-hours-reduced event
      naming the site and the removed periods, and makes no call or event that changes the booking.', 'SS-024.1: a station
      operator saving a valid cap change for its own site at 16:20, during a 16:00 – 18:00 window, gets the new cap from
      the read for the 16:30 slot at once, and no approval record or pending state exists.', 'SS-024.2: a cap change writes
      only the saved rule and its configuration-changed and capacity-rule-changed events; the events request no change to
      any confirmed booking (contract test on the event payload).', 'SS-024.3: at a 16-EVSE site with caps 5 (peak) and
      8 (off-peak), the walk-up read returns cap 5 with 11 walk-up EVSEs and cap 8 with 8.', 'SS-024.4: after the peak cap
      changes from 5 to 6, or an EVSE is added to the site, the next walk-up read returns the new figure for that window.',
    'SS-024.5: a station operator''s change that fails SS-023 clause 2 or 3 is refused whole, and the rule read used by
      holds returns the rules in force before the change.']
  needs: [SS-432.1, SS-440.1, SS-323.3]
  depends_on: [T-103, T-207, T-742, T-909, T-911]
