  kyiv: K
  description: 'When a site-staff request or clear instruction is sent, the dispatcher writes booking.site_staff_item_sent
    (request id, sent at) to the booking module''s outbox. In the booking workflow of batch 1 (`backend/src/workflows/booking/`,
