- id: T-305
  title: Handle site-full bookings with an ops exception and immediate alternatives
  type: backend
  status: approved
  version: 1
  approved_with: {SS-105: 1}
  epic: EP-02
  feature: FT-02.1
  implements: [SS-105]
  traces_to: [REQ-022, REQ-148, REQ-149]
  kyiv: K
  description: 'In booking/allocation, implement the site-full handler behind the port T-302 calls (T-306 calls it at the
    station-hold offset and the pre-arrival check). It marks the booking site-full (table booking.site_full_mark), raises
    the ''site full'' exception through the ops console''s exception interface (SS-219 clause 1) within the platform-wide
    Site-full exception time (default 60 s), and in the same step asks the Booking engine for the next compatible slot at
    the site (SS-009 clause 3) and the nearest compatible slots at other sites (SS-010 clause 1, Number of cross-site alternatives),
    each offer carrying MOVED_SITE_FULL, and emits booking.offers_produced for Messaging (SS-316). It records the fee exclusion
    ''site full'' (T-303). On the Booking engine''s booking-rebooked event for an accepted site-full offer (SS-011 clause
    3) it clears the mark, deactivates the old allocation (T-302) and reports the exception resolved (SS-219 clause 7).
    Nothing changes at the slot start: the booking keeps its slot, mark and open exception, and grace runs as for any booking
    (A-019, Q-033). It does not depend on an ops user being signed in (Q-023). Out of scope: allocating a site-full booking
    at the pre-arrival check (SS-105 clause 6, T-306); the message text (SS-316).

    '
  acceptance_criteria: ['SS-105.1: integration test with a controlled clock: a booking found with no free compatible EVSE
      at its Allocation offset, at its Station-hold offset and at its pre-arrival check is marked site-full and its ''site
      full'' exception is raised within the Site-full exception time; a second detection for the same booking leaves one
      open exception.', 'SS-105.2: integration test: in the same step the same-site and cross-site offers are requested
      for the charging driver, and one booking.offers_produced event carries them with MOVED_SITE_FULL.', 'SS-105.3: integration
