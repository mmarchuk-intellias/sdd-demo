    runs every minute (A-033): it places a hold on the hidden test site through the public booking API (SS-002)     under
    the synthetic-check machine identity (a client-credentials client of the identity realm, T-909, whose only permissions
    are placing and releasing holds on the hidden test site), then releases it, and publishes success or failure as the
    metric synthetic_booking_check_success with the check''s latency. Per environment, a runbook step creates through the
    ops onboarding APIs the hidden test site (one EVSE record with no charger or CSMS behind it, an always-open capacity
    rule) as a live site (SS-028) of an internal station operator with no portal user, and an internal fleet with one compatible
    vehicle (SS-040, SS-038). Cross-module addition (GAP-5-1: no Booking engine clause releases a hold on request): in the
    booking module (backend/src/modules/booking, Booking engine), coordinated with its tasks and reviewed by its owner (D7),
    a public command releaseHold(holdId) on the hold model     of T-124 (SS-002 clause 1), accepted only from the synthetic-check
    identity and only for the hidden test site,     which ends the hold at once so it stops counting against the cap, recorded
    with a new reason code SYNTHETIC_CHECK_RELEASED added to SS-020''s catalogue through its change process (T-122). Out
    of scope: hiding the site from views and the availability figures (T-931, T-929). The release is recorded with the system
    reason code SYNTHETIC_CHECK_RELEASED (SS-020).

    '
  acceptance_criteria: ['SS-428.2: staging test runs the canary for ten minutes and asserts ten check results, each creating
      and releasing one hold on the hidden test site from the shared-services account, with no hold left counting against
