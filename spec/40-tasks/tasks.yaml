    seeded with the default rule "state is Completed" (design.md section 8 "Completed definition", Q-017''s interim rule),
    and a pure evaluator over the evidence fields only: state, arrival (kind, recorded), session-record match, energy, rebooks
    and reason codes, plus a rebooked-bookings option (count or exclude bookings created from a re-offer after a no-show).
