- id: T-108
  title: Onboard a site as data through the ops API with code, time zone and CSMS checks
  type: backend
  status: approved
  version: 2
  approved_with: {SS-028: 1}
  epic: EP-01
  feature: FT-01.7
  implements: [SS-028]
  traces_to: [REQ-138, REQ-165]
  kyiv: K
  description: 'In the `inventory` module, add `POST /v1/sites` for ops: one request with the station operator, address,
    location, site code, IANA time zone, supply pattern, CSMS kind, EVSEs with connectors, capacity rules with bookable
    hours and partner terms. It stores the site as not live (live marking is T-107) with version 1 of its parameters from
    the catalogue defaults (T-101), validating rules with T-103 and terms with T-106, all in one transaction, with no code
    change or deployment. Accepted CSMS kinds are the integrations the platform has (AMPECO, ChargeLab) or none for supply
    pattern C; a new CSMS needs a new integration (A-022, Q-007). Any IANA zone is accepted (A-013; the Los Angeles test
    site of REQ-138). Site codes are unique. Only ops may create a site or mark it live. Requires an Idempotency-Key (library
    of T-207). Writes a configuration-changed event. Out of scope: screens (T-200), the site''s live status source (EVSE
    status service). Routes are versioned and published in the API description (batch 5''s T-911, SS-432), and each declares
    its permission in the identity role matrix, enforced by the deny-by-default guard that defines the ops and partner roles
    (batch 5''s T-909, SS-440 clause 1). The onboarding request also takes each EVSE''s external id in its CSMS (SS-030.5)
    and accepts the CSMS kind ''simulator'' in CI and staging, which T-555 registers. The station operator is a minimal
    record (id, name) in `inventory` (data-model.md, G-3): a site that names an operator not yet known creates it, and a
    site that names a known operator references it.

    '
  acceptance_criteria: ['SS-028.1: an ops request with every onboarding item stores the site as not live, with its EVSEs,
      connectors, rules and terms readable, and the test runs against the deployed build with no code change or migration.',
    'SS-028.2: a site with CSMS kind ''AMPECO'' or ''ChargeLab'' is accepted, a supply-pattern-C site with no CSMS is accepted,
      and a site naming an unknown CSMS kind is refused.', 'SS-028.3: sites with the zones America/New_York, America/Los_Angeles
      and Europe/Kyiv are accepted; an unknown zone name is refused.', 'SS-028.7: parameterised over create and go-live:
