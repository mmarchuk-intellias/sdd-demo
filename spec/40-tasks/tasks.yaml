  kyiv: K
  description: 'In booking/allocation, add to the public interface checkBeforeStationHold(bookingId), which the Station-hold
    dispatcher''s step calls before it places a station hold (T-316); runPreArrivalCheck(bookingId, dueAt, firedAt, stepKey),
    the step the booking workflow calls at the Pre-arrival check offset (SS-032 clause 4); and onReservationRejectedInUse(bookingId),
    called by the dispatcher (T-318). Each reads the allocated EVSE''s last known status (SS-202); if it is occupied or
    charging and the booking has no recorded arrival (hasArrival, T-303), it reallocates through T-301: deactivates the
    old allocation, writes the new one, records the change with the system as actor and REALLOCATED_EVSE_OCCUPIED, and emits
    booking.reallocated (old and new EVSE and stall) for Messaging (SS-301), clearing (T-321) and the new station hold (T-317).
    With no other free compatible EVSE it keeps the allocation and calls the site-full handler (T-305). The pre-arrival
    check also allocates a site-full booking that has no allocation and was not rebooked when a free compatible EVSE now
    exists (ALLOCATED, exception resolved), and emits booking.pre_arrival_checked for the dispatcher (T-325). The component
    has no port that stops a charging session and emits no message asking anyone to leave (REQ-020). Parameters: Station-hold
    offset, Pre-arrival check offset (the booking''s version). LIC status is the attendant''s (A-054, U-13). For runPreArrivalCheck:
    It binds this step to the booking workflow''s activity port in `backend/src/workflows/booking/activities/` (batch 1''s
    T-161, SS-032 clause 4), replacing the stub there; nothing else in the workflows module changes. Out of scope: placing
    station holds (T-316, T-317), blocked stalls (T-339), charge not started (T-340).

    '
