    5 min) of the trigger, with the alternatives offered and the driver''s answer so far, and attaches a rebooking proposal
    (table booking.rebooking_proposal) to the first alternative offered, holding no capacity; with no alternative anywhere
    the exception states that none could be offered and is marked "no proposal possible". It records the fee exclusion ''site
    faulted'' (T-303). On the Booking engine''s offer answers (SS-011 clauses 6 and 9) it updates the exception (SS-219
    clause 8); on the booking-rebooked event of an accepted alternative (SS-011 clause 3) the rebooking keeps the offer''s
    code, no NoShow is recorded, the exception is reported resolved and the proposal withdrawn. The exception is raised
    whoever is on duty (Q-023). Out of scope: ops approval (T-311); final outcomes (T-310).

