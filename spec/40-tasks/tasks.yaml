  epic: EP-02
  feature: FT-02.2
  implements: [SS-116]
  traces_to: [REQ-024, REQ-025, REQ-028]
  kyiv: K
  description: 'In booking/station-hold, extend the station-hold step (T-316) for an EVSE flagged reservable when the step
    runs (SS-029 clause 3), in normal mode: request a charger reservation through the vendor-neutral CSMS interface (SS-217
    clause 1; only where the site''s integration declares the charger-reservation capability, clause 3) with an expiry equal
    to the booking''s end of grace when the request is sent (slot start plus the Grace period fixed at confirmation plus
    recorded ops extensions, T-303), and record the attempt (T-304). The flag in force when the step runs decides the method,
    so a flag set or cleared before then applies to bookings allocated earlier. No reservation is ever sent before the Station-hold
    offset. On booking.allocated or booking.reallocated after the booking''s station-hold point has passed (T-302, T-306,
    T-307, T-339), place the station hold at once on the new EVSE by that EVSE''s method and none on the earlier one; at
    most one station hold per active allocation (keyed by allocation id). The rules are the same at every supply pattern;
    only the method differs by EVSE. Results are handled by T-318. Q-009, Q-060, U-1. Out of scope: rejection and timeout
    fallback (T-318), grace extensions (T-324), manual and degraded mode (T-322, T-326), the AMPECO call (SS-212, batch
    3).

    '
  acceptance_criteria: ['SS-116.1: integration test with a fake CSMS integration declaring reservations: at the Station-hold
      offset, for an allocated booking on a reservable EVSE not in use at a site in normal mode, one reservation request
      is sent with an expiry no earlier than the booking''s end of grace; with the mode port returning manual or degraded
      none is sent.', 'SS-116.2: unit test: the expiry equals slot start plus the Grace period fixed at confirmation plus
